[workspace]
resolver = "2"
members = [
    "crates/browser-core",
    "crates/browser-network",
    "crates/browser-html",
    "crates/browser-css",
    "crates/browser-layout",
    "crates/browser-storage",
    "crates/browser-privacy",
    "crates/browser-terminal",
    "crates/browser-mcp",
    "crates/browser-cli",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.package]
version = "0.29.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/meerita/puma-browser"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# Terminal UI
ratatui = "0.30"
crossterm = "0.29"

# Clipboard
arboard = "3"
base64 = "0.23"

# HTTP / TLS
reqwest = { version = "0.13", features = ["rustls", "stream", "gzip", "brotli", "zstd", "http2"], default-features = false }
rustls = "0.23"
url = "2"
percent-encoding = "2"

# Document processing
html5ever = "0.39"
cssparser = "0.37"
encoding_rs = "0.8"

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "5"

# Config
toml = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unicode
unicode-segmentation = "1"
unicode-width = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# MCP
rmcp = { version = "3.0.0-beta.2", features = ["server", "transport-io"] }
schemars = "1"
